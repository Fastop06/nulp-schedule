<!DOCTYPE html>
<html lang="uk" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>ШІ-11 | Розклад & Дедлайни</title>
  
  <!-- Telegram WebApp SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  
  <!-- Tailwind CSS & Fonts -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <!-- Custom Styling -->
  <link rel="stylesheet" href="style.css">
  
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
          },
          colors: {
            brand: {
              50: '#eef2ff',
              100: '#e0e7ff',
              400: '#818cf8',
              500: '#6366f1',
              600: '#4f46e5',
              700: '#4338ca',
            },
            dark: {
              bg: '#0f1117',
              card: '#181b24',
              surface: '#212634',
              border: '#2a3142',
            }
          }
        }
      }
    }
  </script>
</head>
<body class="bg-[#0b0d13] text-gray-100 min-h-screen flex flex-col font-sans pb-28 select-none antialiased">

  <!-- Top Header / App Bar -->
  <header class="sticky top-0 z-30 bg-[#0b0d13]/85 backdrop-blur-xl border-b border-gray-800/60 px-4 py-3">
    <div class="max-w-xl mx-auto flex items-center justify-between gap-2">
      <div class="flex items-center gap-2.5">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-600 to-purple-500 flex items-center justify-center text-white shadow-lg shadow-indigo-500/25">
          <i data-lucide="graduation-cap" class="w-5 h-5"></i>
        </div>
        <div>
          <div class="flex items-center gap-1.5">
            <h1 class="font-bold text-base tracking-tight text-white">ШІ-11</h1>
            <span class="text-[10px] uppercase font-bold tracking-wider px-1.5 py-0.5 rounded-md bg-indigo-500/20 text-indigo-400 border border-indigo-500/30">NULP</span>
          </div>
          <p id="header-date" class="text-xs text-gray-400 font-medium"></p>
        </div>
      </div>

      <!-- Controls (Week & Subgroup pills) -->
      <div class="flex items-center gap-1.5">
        <button id="week-toggle-btn" class="px-2.5 py-1.5 rounded-lg bg-gray-800/80 hover:bg-gray-700/80 active:scale-95 border border-gray-700/60 text-xs font-semibold flex items-center gap-1.5 transition text-indigo-300">
          <i data-lucide="repeat" class="w-3.5 h-3.5"></i>
          <span id="week-toggle-text">Знаменник</span>
        </button>

        <button id="subgroup-toggle-btn" class="px-2.5 py-1.5 rounded-lg bg-gray-800/80 hover:bg-gray-700/80 active:scale-95 border border-gray-700/60 text-xs font-semibold flex items-center gap-1 transition text-purple-300">
          <i data-lucide="users" class="w-3.5 h-3.5"></i>
          <span id="subgroup-toggle-text">I підгр.</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Main Content Container -->
  <main class="max-w-xl w-full mx-auto px-4 pt-4 flex-1">

    <!-- ================= TAB 1: SCHEDULE ================= -->
    <section id="tab-schedule" class="tab-content active space-y-4">
      
      <!-- Day Selector Carousel -->
      <div class="flex items-center gap-1.5 overflow-x-auto no-scrollbar py-1" id="day-selector-container">
        <!-- Generated by JS -->
      </div>

      <!-- Live Status Banner (Now / Next) -->
      <div id="live-status-card" class="rounded-2xl p-4 bg-gradient-to-r from-indigo-950/60 to-purple-950/50 border border-indigo-500/30 relative overflow-hidden shadow-xl backdrop-blur-md">
        <div class="relative z-10 flex items-start justify-between gap-3">
          <div class="space-y-1">
            <div class="flex items-center gap-2">
              <span id="live-badge" class="px-2 py-0.5 rounded-full text-[11px] font-bold tracking-wide uppercase bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 flex items-center gap-1.5">
                <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-ping"></span>
                Зараз
              </span>
              <span id="live-countdown" class="text-xs font-mono text-gray-300"></span>
            </div>
            <h2 id="live-title" class="font-bold text-base text-white leading-snug">Завантаження...</h2>
            <p id="live-details" class="text-xs text-gray-300"></p>
          </div>
          <div id="live-icon" class="w-10 h-10 rounded-xl bg-indigo-600/30 border border-indigo-500/40 flex items-center justify-center text-indigo-300 shrink-0">
            <i data-lucide="clock" class="w-5 h-5"></i>
          </div>
        </div>
      </div>

      <!-- Day Header & Gaps Summary -->
      <div class="flex items-center justify-between pt-1">
        <h3 id="current-day-heading" class="font-bold text-sm tracking-tight text-gray-200">Пари на день</h3>
        <span id="current-day-count" class="text-xs font-medium text-gray-400"></span>
      </div>

      <!-- Lessons List -->
      <div id="lessons-list" class="space-y-3">
        <!-- Rendered by JS -->
      </div>
    </section>

    <!-- ================= TAB 2: DEADLINES & TASKS ================= -->
    <section id="tab-tasks" class="tab-content hidden space-y-4">
      
      <!-- Filter Chips & Search -->
      <div class="space-y-2.5">
        <div class="flex items-center justify-between">
          <h2 class="font-bold text-lg text-white">Домашка & Дедлайни</h2>
          <button id="add-task-btn" class="px-3 py-1.5 rounded-xl bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-500 hover:to-purple-500 active:scale-95 text-xs font-bold text-white shadow-lg shadow-indigo-500/30 flex items-center gap-1.5 transition">
            <i data-lucide="plus" class="w-4 h-4"></i>
            Додати
          </button>
        </div>

        <div class="flex items-center gap-2 overflow-x-auto no-scrollbar py-0.5">
          <button class="task-filter-btn px-3 py-1 rounded-lg text-xs font-semibold bg-indigo-600 text-white transition active:scale-95" data-filter="active">Активні</button>
          <button class="task-filter-btn px-3 py-1 rounded-lg text-xs font-semibold bg-gray-800 text-gray-300 hover:bg-gray-700 transition active:scale-95" data-filter="all">Всі</button>
          <button class="task-filter-btn px-3 py-1 rounded-lg text-xs font-semibold bg-gray-800 text-gray-300 hover:bg-gray-700 transition active:scale-95" data-filter="high">🔥 Термінові</button>
          <button class="task-filter-btn px-3 py-1 rounded-lg text-xs font-semibold bg-gray-800 text-gray-300 hover:bg-gray-700 transition active:scale-95" data-filter="completed">✅ Виконані</button>
        </div>
      </div>

      <!-- Tasks List -->
      <div id="tasks-list" class="space-y-2.5">
        <!-- Rendered by JS -->
      </div>
    </section>

    <!-- ================= TAB 3: BELLS ================= -->
    <section id="tab-bells" class="tab-content hidden space-y-4">
      <div class="space-y-1">
        <h2 class="font-bold text-lg text-white">Розклад дзвінків</h2>
        <p class="text-xs text-gray-400">Львівська Політехніка (80 хв пара / 15 хв перерва)</p>
      </div>

      <div id="bells-list" class="space-y-2.5">
        <!-- Rendered by JS -->
      </div>
    </section>

    <!-- ================= TAB 4: CAMPUSES & TEACHERS ================= -->
    <section id="tab-directory" class="tab-content hidden space-y-4">
      <!-- Sub-tabs -->
      <div class="flex rounded-xl bg-gray-900 p-1 border border-gray-800">
        <button id="dir-tab-campuses" class="flex-1 py-1.5 rounded-lg text-xs font-bold bg-indigo-600 text-white transition">🏛 Корпуси</button>
        <button id="dir-tab-teachers" class="flex-1 py-1.5 rounded-lg text-xs font-bold text-gray-400 hover:text-white transition">👨‍🏫 Викладачі</button>
      </div>

      <!-- Campuses View -->
      <div id="dir-campuses-view" class="space-y-3">
        <!-- Rendered by JS -->
      </div>

      <!-- Teachers View -->
      <div id="dir-teachers-view" class="space-y-2.5 hidden">
        <!-- Rendered by JS -->
      </div>
    </section>

    <!-- ================= TAB 5: NOTES & MATERIALS ================= -->
    <section id="tab-notes" class="tab-content hidden space-y-4">
      <div class="flex items-center justify-between">
        <div>
          <h2 class="font-bold text-lg text-white">Матеріали & Нотатки</h2>
          <p class="text-xs text-gray-400">Посилання на диски, GitHub та конспекти</p>
        </div>
        <button id="add-note-btn" class="px-3 py-1.5 rounded-xl bg-gray-800 hover:bg-gray-700 active:scale-95 border border-gray-700 text-xs font-semibold text-white flex items-center gap-1.5 transition">
          <i data-lucide="plus" class="w-4 h-4"></i>
          Нотатка
        </button>
      </div>

      <div id="notes-list" class="space-y-3">
        <!-- Rendered by JS -->
      </div>
    </section>

  </main>

  <!-- ================= ADD TASK MODAL (BOTTOM SHEET) ================= -->
  <div id="task-modal" class="fixed inset-0 z-50 bg-black/70 backdrop-blur-sm flex items-end justify-center hidden opacity-0 transition-opacity duration-200">
    <div class="bg-[#151821] border-t border-gray-800 w-full max-w-xl rounded-t-3xl p-5 space-y-4 shadow-2xl max-h-[90vh] overflow-y-auto">
      <div class="flex items-center justify-between pb-1 border-b border-gray-800/60">
        <h3 class="font-bold text-base text-white flex items-center gap-2">
          <i data-lucide="plus-circle" class="w-5 h-5 text-indigo-400"></i>
          Нове завдання
        </h3>
        <button id="close-task-modal" class="p-1 rounded-lg text-gray-400 hover:text-white hover:bg-gray-800">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>

      <!-- Subject Picker -->
      <div class="space-y-1.5">
        <label class="text-xs font-semibold text-gray-300">Предмет</label>
        <select id="task-subject-input" class="w-full bg-gray-900 border border-gray-700/80 rounded-xl px-3.5 py-2.5 text-sm text-white focus:outline-none focus:border-indigo-500">
          <!-- Populated by JS -->
        </select>
      </div>

      <!-- Task Description -->
      <div class="space-y-1.5">
        <label class="text-xs font-semibold text-gray-300">Опис завдання</label>
        <textarea id="task-desc-input" rows="3" placeholder="Наприклад: Зробити лабу №2, варіант 7" class="w-full bg-gray-900 border border-gray-700/80 rounded-xl px-3.5 py-2.5 text-sm text-white placeholder-gray-500 focus:outline-none focus:border-indigo-500"></textarea>
      </div>

      <!-- Quick Deadline Buttons -->
      <div class="space-y-1.5">
        <label class="text-xs font-semibold text-gray-300">Швидкий дедлайн</label>
        <div class="grid grid-cols-2 gap-2 text-xs">
          <button type="button" class="quick-dl-btn py-2 px-3 rounded-lg bg-gray-900 border border-gray-800 text-gray-300 hover:border-indigo-500 hover:text-white transition" data-dl="today">Сьогодні 23:59</button>
          <button type="button" class="quick-dl-btn py-2 px-3 rounded-lg bg-gray-900 border border-gray-800 text-gray-300 hover:border-indigo-500 hover:text-white transition" data-dl="tmrw">Завтра 23:59</button>
          <button type="button" class="quick-dl-btn py-2 px-3 rounded-lg bg-gray-900 border border-gray-800 text-gray-300 hover:border-indigo-500 hover:text-white transition" data-dl="2days">Через 2 дні</button>
          <button type="button" class="quick-dl-btn py-2 px-3 rounded-lg bg-gray-900 border border-gray-800 text-gray-300 hover:border-indigo-500 hover:text-white transition" data-dl="friday">П'ятниця 23:59</button>
        </div>
      </div>

      <!-- Exact Date/Time Picker -->
      <div class="grid grid-cols-2 gap-2.5">
        <div class="space-y-1">
          <label class="text-xs font-semibold text-gray-400">Дата</label>
          <input type="date" id="task-date-input" class="w-full bg-gray-900 border border-gray-700/80 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-indigo-500">
        </div>
        <div class="space-y-1">
          <label class="text-xs font-semibold text-gray-400">Час</label>
          <input type="time" id="task-time-input" value="23:59" class="w-full bg-gray-900 border border-gray-700/80 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-indigo-500">
        </div>
      </div>

      <!-- Priority Selector -->
      <div class="space-y-1.5">
        <label class="text-xs font-semibold text-gray-300">Пріоритет</label>
        <div class="grid grid-cols-3 gap-2 text-xs">
          <label class="flex items-center justify-center gap-1.5 p-2 rounded-xl bg-gray-900 border border-gray-800 cursor-pointer has-[:checked]:border-red-500 has-[:checked]:bg-red-500/10 has-[:checked]:text-red-400">
            <input type="radio" name="priority" value="high" class="hidden">
            🔥 Високий
          </label>
          <label class="flex items-center justify-center gap-1.5 p-2 rounded-xl bg-gray-900 border border-gray-800 cursor-pointer has-[:checked]:border-amber-500 has-[:checked]:bg-amber-500/10 has-[:checked]:text-amber-400">
            <input type="radio" name="priority" value="normal" checked class="hidden">
            🟡 Звичайний
          </label>
          <label class="flex items-center justify-center gap-1.5 p-2 rounded-xl bg-gray-900 border border-gray-800 cursor-pointer has-[:checked]:border-emerald-500 has-[:checked]:bg-emerald-500/10 has-[:checked]:text-emerald-400">
            <input type="radio" name="priority" value="low" class="hidden">
            🟢 Низький
          </label>
        </div>
      </div>

      <!-- Save Button -->
      <button id="save-task-btn" class="w-full py-3 rounded-xl bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-500 hover:to-purple-500 active:scale-[0.98] font-bold text-sm text-white shadow-xl shadow-indigo-500/25 transition">
        Зберегти завдання
      </button>
    </div>
  </div>

  <!-- ================= ADD NOTE MODAL ================= -->
  <div id="note-modal" class="fixed inset-0 z-50 bg-black/70 backdrop-blur-sm flex items-end justify-center hidden opacity-0 transition-opacity duration-200">
    <div class="bg-[#151821] border-t border-gray-800 w-full max-w-xl rounded-t-3xl p-5 space-y-4 shadow-2xl">
      <div class="flex items-center justify-between pb-1 border-b border-gray-800/60">
        <h3 class="font-bold text-base text-white flex items-center gap-2">
          <i data-lucide="bookmark-plus" class="w-5 h-5 text-indigo-400"></i>
          Додати нотатку / посилання
        </h3>
        <button id="close-note-modal" class="p-1 rounded-lg text-gray-400 hover:text-white hover:bg-gray-800">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>

      <div class="space-y-1.5">
        <label class="text-xs font-semibold text-gray-300">Предмет</label>
        <select id="note-subject-input" class="w-full bg-gray-900 border border-gray-700/80 rounded-xl px-3.5 py-2.5 text-sm text-white focus:outline-none focus:border-indigo-500">
        </select>
      </div>

      <div class="space-y-1.5">
        <label class="text-xs font-semibold text-gray-300">Заголовок</label>
        <input type="text" id="note-title-input" placeholder="Наприклад: Google Drive або Лекція №3" class="w-full bg-gray-900 border border-gray-700/80 rounded-xl px-3.5 py-2.5 text-sm text-white placeholder-gray-500 focus:outline-none focus:border-indigo-500">
      </div>

      <div class="space-y-1.5">
        <label class="text-xs font-semibold text-gray-300">Вміст / Посилання</label>
        <textarea id="note-content-input" rows="3" placeholder="Введіть посилання на диск, конспект або текст..." class="w-full bg-gray-900 border border-gray-700/80 rounded-xl px-3.5 py-2.5 text-sm text-white placeholder-gray-500 focus:outline-none focus:border-indigo-500"></textarea>
      </div>

      <button id="save-note-btn" class="w-full py-3 rounded-xl bg-gradient-to-r from-indigo-600 to-purple-600 font-bold text-sm text-white shadow-xl shadow-indigo-500/25 transition active:scale-[0.98]">
        Зберегти нотатку
      </button>
    </div>
  </div>

  <!-- ================= BOTTOM NAVIGATION BAR ================= -->
  <nav class="fixed bottom-0 left-0 right-0 z-40 bg-[#0b0d13]/90 backdrop-blur-xl border-t border-gray-800/80 px-2 py-2 safe-area-pb">
    <div class="max-w-xl mx-auto flex items-center justify-around">
      
      <button class="nav-btn active flex flex-col items-center gap-1 py-1 px-3 rounded-xl transition text-indigo-400" data-tab="tab-schedule">
        <i data-lucide="calendar" class="w-5 h-5"></i>
        <span class="text-[10px] font-bold">Розклад</span>
      </button>

      <button class="nav-btn flex flex-col items-center gap-1 py-1 px-3 rounded-xl transition text-gray-400 hover:text-gray-200" data-tab="tab-tasks">
        <div class="relative">
          <i data-lucide="check-square" class="w-5 h-5"></i>
          <span id="nav-task-badge" class="absolute -top-1 -right-1 w-2 h-2 rounded-full bg-indigo-500 hidden"></span>
        </div>
        <span class="text-[10px] font-bold">Дедлайни</span>
      </button>

      <button class="nav-btn flex flex-col items-center gap-1 py-1 px-3 rounded-xl transition text-gray-400 hover:text-gray-200" data-tab="tab-bells">
        <i data-lucide="bell" class="w-5 h-5"></i>
        <span class="text-[10px] font-bold">Дзвінки</span>
      </button>

      <button class="nav-btn flex flex-col items-center gap-1 py-1 px-3 rounded-xl transition text-gray-400 hover:text-gray-200" data-tab="tab-directory">
        <i data-lucide="map-pin" class="w-5 h-5"></i>
        <span class="text-[10px] font-bold">Корпуси</span>
      </button>

      <button class="nav-btn flex flex-col items-center gap-1 py-1 px-3 rounded-xl transition text-gray-400 hover:text-gray-200" data-tab="tab-notes">
        <i data-lucide="bookmark" class="w-5 h-5"></i>
        <span class="text-[10px] font-bold">Нотатки</span>
      </button>

    </div>
  </nav>

  <!-- App Script -->
  <script src="app.js"></script>
</body>
</html>
